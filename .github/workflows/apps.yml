name: Aplikace ke stažení
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'desktop/**', '.github/workflows/apps.yml']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Klíč pro podpis
        working-directory: android/app
        run: keytool -genkeypair -v -keystore release.keystore -alias vexaronet -keyalg RSA -keysize 2048 -validity 10000 -storepass vexaronet -keypass vexaronet -dname "CN=Vexaronet, O=Vexaronet, C=CZ"
      - name: Sestavení APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk Vexaronet.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: Vexaronet.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Sestavení EXE
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: desktop/dist/Vexaronet.exe }
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Aplikace Vexaronet (Android a Windows)
          body: Instalační soubory aplikace Vexaronet. Android (Vexaronet.apk) a Windows (Vexaronet.exe).
          files: |
            out/apk/Vexaronet.apk
            out/exe/Vexaronet.exe
          make_latest: false
