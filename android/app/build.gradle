plugins { id 'com.android.application' }
android {
    namespace 'com.vexaronet.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.vexaronet.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'release.keystore')
            storePassword System.getenv('KS_PASS') ?: 'vexaronet'
            keyAlias 'vexaronet'
            keyPassword System.getenv('KS_PASS') ?: 'vexaronet'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
